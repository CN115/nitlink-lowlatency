name: Windows audio reliability
on:
  push:
    branches: [codex/audio-reliability]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Validate localization resources
        run: node scripts/validate-locales.js
      - name: Configure x64 Release
        run: cmake -S . -B build -G "Visual Studio 17 2022" -A x64 -DNITLINK_TEST_WEBVIEW_RUNTIME=ON
      - name: Compile application and tests
        run: cmake --build build --config Release --parallel 4
      - name: Run all tests
        run: ctest --test-dir build -C Release --output-on-failure --timeout 90
      - name: Measure resampler CPU cost
        run: build/Release/NitLinkAudioResamplerBenchmark.exe | Tee-Object -FilePath build/audio-benchmark.txt
      - name: Package portable Windows build
        shell: pwsh
        run: |
          cmake --install build --config Release --prefix staging
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Copy-Item AUDIO_TESTING.txt staging/bin/
          $vs = & "${env:ProgramFiles(x86)}/Microsoft Visual Studio/Installer/vswhere.exe" -latest -property installationPath
          $crt = Get-ChildItem "$vs/VC/Redist/MSVC/*/x64/Microsoft.VC143.CRT" -Directory | Sort-Object FullName -Descending | Select-Object -First 1
          if (-not $crt) { throw 'VC runtime folder not found' }
          foreach ($dll in @('vcruntime140.dll','vcruntime140_1.dll','msvcp140.dll','msvcp140_1.dll','msvcp140_2.dll')) {
            if (Test-Path "$($crt.FullName)/$dll") { Copy-Item "$($crt.FullName)/$dll" staging/bin/ }
          }
          "commit=$env:GITHUB_SHA`nupstream=19c011c235cb3457bfa54c789516205c3e6e9fc0`nvariant=CN115 audio-reliability test build" | Set-Content staging/bin/BUILD.txt
          if (-not (Test-Path staging/bin/NitLinkAudioReplay.exe)) { throw 'Replay utility missing' }
          & ./scripts/validate-package.ps1 -Path staging/bin
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          New-Item -ItemType Directory -Force release-assets | Out-Null
          Compress-Archive -Path staging/bin/* -DestinationPath release-assets/NitLink-CN115-audio-next-win64.zip
          $zip = Get-FileHash release-assets/NitLink-CN115-audio-next-win64.zip -Algorithm SHA256
          "$($zip.Hash.ToLower())  NitLink-CN115-audio-next-win64.zip" | Set-Content release-assets/SHA256SUMS.txt
          Copy-Item AUDIO_TESTING.txt release-assets/
          Expand-Archive release-assets/NitLink-CN115-audio-next-win64.zip package-check
          $build = Get-Content package-check/BUILD.txt -Raw
          if (-not $build.Contains("commit=$env:GITHUB_SHA")) { throw 'Packaged commit mismatch' }
          Get-Content package-check/SHA256SUMS.txt | ForEach-Object {
            $hash, $relative = $_ -split '  ', 2
            if ((Get-FileHash (Join-Path package-check $relative) -Algorithm SHA256).Hash.ToLower() -ne $hash) {
              throw "Packaged checksum mismatch: $relative"
            }
          }
      - uses: actions/upload-artifact@v4
        with:
          name: NitLink-CN115-audio-next-win64
          path: release-assets/*
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Windows-test-results
          path: |
            build/Testing/Temporary/LastTest.log
            build/Testing/Temporary/LastTestsFailed.log
            build/audio-benchmark.txt
